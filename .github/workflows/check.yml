name: Rusted
on:
  push:
    paths-ignore: ['docs/**', 'README.md', 'THIRD_PARTY.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md', 'THIRD_PARTY.md']
  workflow_dispatch:
concurrency:
  group: rusted-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  bridge:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.90.0 --profile minimal
      - run: cargo test --workspace --locked
      - run: python scripts/check_public_tree.py
      - run: python scripts/test_launcher_auth_config.py
      - run: python scripts/test_restore_native_build.py
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python scripts/build_launcher_entry.py
      - run: python scripts/test_launcher_java_entry.py --java java
      - run: python scripts/build_bootstrap.py
      - run: cargo build --locked -p rusted-launch --examples
      - run: python scripts/test_bootstrap_process.py
      - run: python scripts/test_horizon_bridge.py
      - if: runner.os == 'Windows'
        run: cargo build --release --locked -p rusted-launch
      - run: python scripts/test_bridge.py
      - run: python scripts/build_mod.py --host
      - run: python scripts/test_minecraft.py
  horizon-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: python scripts/horizon.py fetch
      - run: python scripts/horizon.py build-tools
      - run: python scripts/horizon.py test-tools
      - run: python scripts/test_horizon_tools.py
  rusted-native-windows:
    # Default Microsoft Live compatibility client works without an Entra registration.
    env:
      RUSTED_MICROSOFT_CLIENT_ID: ${{ vars.RUSTED_MICROSOFT_CLIENT_ID }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.90.0 --profile minimal
      - run: rustup toolchain install 1.99.1 --profile minimal
      - name: Verify native Windows compiler
        shell: pwsh
        run: |
          $info = (rustc -vV) -join "`n"
          if ($info -notmatch 'host: x86_64-pc-windows-msvc') {
            throw 'Windows releases must be compiled natively with the MSVC toolchain.'
          }
      - name: Enable protection on the ephemeral Windows test runner
        shell: pwsh
        run: ./scripts/prepare_windows_defender_ci.ps1
      - run: cargo test --workspace --locked
      - name: Verify real Microsoft device sign-in request without an account
        run: cargo test -p rusted-launcher --lib public_live_client_can_request_a_code_without_an_account -- --ignored
      - run: cargo +1.99.1 test --manifest-path engine/Cargo.toml --locked -p rusted-platform
      - run: cargo build --release --locked -p rusted-launch
      - run: python scripts/build_bootstrap.py
      - run: cargo build --locked -p rusted-launch --examples
      - run: python scripts/test_bootstrap_process.py
      - run: python scripts/test_horizon_bridge.py
      - name: Verify pinned exporters before compiling the native engine
        run: python scripts/prepare_horizon_exporters.py
      - name: Download previous validated native build
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: rusted-native-windows-0.3.5
          run-id: 40907164336
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/native-build-cache
      - name: Restore unchanged engine binaries from the validated MSVC build
        id: native-cache
        run: python scripts/restore_native_build.py --archive build/native-build-cache/Rusted-Native-Windows-0.3.5.zip --expected-sha256 23b9e7cc34530f5a2e274140cbb1d64822669a3dc58bd580ae7779ffad15eb93
      - if: steps.native-cache.outputs.restored != 'true'
        run: python scripts/rusted.py build
      - run: cargo +1.99.1 run --release --manifest-path engine/Cargo.toml --locked -p horizon-shader-api --bin horizon-shader -- pack shaderpacks/rusted_soft_light --out build/Rusted-Soft-Light.hshader
      - run: build/horizon/target/release/rusted.exe --help
      - name: Preserve compiled engine binaries and their source receipt
        uses: actions/upload-artifact@v4
        with:
          name: rusted-native-compiler-output-0.3.6
          path: |
            build/horizon/target/release/rusted.exe
            build/horizon/target/release/horizon-prepare.exe
            build/horizon/target/release/rusted-build.json
      - run: python scripts/package_horizon_native.py --binary-dir build/horizon/target/release --bridge-binary target/release/rusted-launch.exe --setup-binary target/release/rusted-setup.exe
      - run: python scripts/test_import_pack_layout.py
      - run: cargo build --release --locked -p rusted-launcher
      - run: python scripts/package_launcher.py --source
      - name: Save the compiled engine for source-verified test retries
        uses: actions/upload-artifact@v4
        with:
          name: rusted-native-engine-build-0.3.6
          path: build/Rusted-Native-Windows-0.3.6.zip
      - name: Validate release with active Microsoft Defender
        shell: pwsh
        run: ./scripts/verify_windows_release.ps1 -ArchivePath build/Rusted-Launcher-Windows-0.2.5.zip -ReportPath build/Rusted-Windows-Validation.json
      - name: Preserve Windows validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rusted-windows-validation
          if-no-files-found: ignore
          path: |
            build/Rusted-Windows-Validation.json
            build/Rusted-Windows-Validation.scan.log
      - uses: actions/upload-artifact@v4
        with:
          name: rusted-native-windows-0.3.6
          path: |
            build/Rusted-Native-Windows-0.3.6.zip
            build/Rusted-Native-Prism-0.3.6.zip
            build/Rusted-Native-Modrinth-0.3.6.mrpack
            build/Rusted-Launcher-Windows-0.2.5.zip
            build/Rusted-Launcher-Source-0.2.5.zip
            build/Rusted-Launcher-0.2.5-SHA256SUMS.txt

  prism-wrapper-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qtbase5-dev
      - run: python scripts/test_prism_wrapper.py
