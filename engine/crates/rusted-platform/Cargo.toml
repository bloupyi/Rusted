[package]
name = "rusted-platform"
version = "0.3.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "Rusted identity and read-only Java mod diagnostics shared by game and launcher bridge"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "=3.23.0"
