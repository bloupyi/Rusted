[package]
name = "rusted-java"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "Experimental JVM host for unchanged Fabric JARs inside the native Rusted client"

[dependencies]
rusted-platform = { path = "../rusted-platform" }
jni = { version = "0.21.1", features = ["invocation"] }
libloading = "0.8.9"
serde_json = "1"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
tempfile = "=3.23.0"

[build-dependencies]
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
