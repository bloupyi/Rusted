[package]
name = "rusted-launcher"
version = "0.2.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Original Rusted Launcher: instances, verified preload, accounts and native/Java launch"

[dependencies]
rusted-launch = { path = "../launcher-bridge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "=3.23.0"
fs2 = "0.4"
ureq = { version = "=2.12.1", default-features = false, features = ["tls", "native-certs", "proxy-from-env", "json"] }
url = "2"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_DataExchange", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_Security_Cryptography"] }

[build-dependencies]
winresource = "0.1"
