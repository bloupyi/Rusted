[package]
name = "rusted-launch"
version = "0.3.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Prism/Modrinth wrapper for Rusted native or the original JVM"

[dependencies]
rusted-platform = { path = "../engine/crates/rusted-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "=3.23.0"
sha1 = "0.10"
sha2 = "0.10"
fs2 = "0.4"
ureq = { version = "=2.12.1", default-features = false, features = ["tls", "native-certs", "proxy-from-env"] }
url = "2"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
